<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通知探针</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #141019; color: #eae8f0;
      padding: 24px 20px; min-height: 100vh;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #9a94b0; margin-bottom: 28px; }
    .card {
      background: #1e1a27; border-radius: 16px; padding: 20px; margin-bottom: 16px;
      border: 1px solid #2c2638;
    }
    .card h2 { font-size: 16px; margin-bottom: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      flex: 1; min-width: 130px; padding: 14px 12px; border: none; border-radius: 12px;
      background: #7c5cfc; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: 0.85; }
    button.gray { background: #322b40; }
    #log {
      font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #b8a6ff;
      background: #0f0c14; border-radius: 12px; padding: 14px; min-height: 120px;
      white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>通知探针</h1>
  <div class="sub">独立 MessagingStyle 会话通知测试（com.bairimeng.probe）</div>

  <div class="card">
    <h2>① 发送三条消息（同一会话 test_role）</h2>
    <div class="row">
      <button id="btn1">消息1：你好，这是第一条消息</button>
      <button id="btn2">消息2：这是第二条消息</button>
      <button id="btn3">消息3：这是第三条消息</button>
    </div>
  </div>

  <div class="card">
    <h2>② 不同会话（验证多角色各自成组）</h2>
    <div class="row">
      <button id="btnA" class="gray">角色A：另一条会话</button>
      <button id="btnB" class="gray">角色B：第三会话</button>
    </div>
  </div>

  <div class="card">
    <h2>③ 日志</h2>
    <div id="log">等待操作…</div>
  </div>

  <script>
    // 从 Capacitor 全局拿插件注册器（Capacitor 会把插件挂到 window.Capacitor.Plugins）
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += '\n' + new Date().toLocaleTimeString() + ' ' + msg;
      el.scrollTop = el.scrollHeight;
    }
    function show(convId, sender, text) {
      try {
        const cap = window.Capacitor;
        if (!cap || !cap.Plugins || !cap.Plugins.BmConversationNotify) {
          log('✗ 插件未加载：请确认 MainActivity 已 registerPlugin');
          return;
        }
        cap.Plugins.BmConversationNotify.showConversation({ conversationId: convId, senderName: sender, messageText: text })
          .then(r => log((r && r.ok ? '✓' : '✗') + ' id=' + (r && r.notificationId) + ' ' + (r && r.reason || '') + '  [' + text + ']'))
          .catch(e => log('✗ 异常: ' + e));
      } catch (e) {
        log('✗ 调用异常: ' + e);
      }
    }
    document.getElementById('btn1').onclick = () => show('test_role', '测试角色', '你好，这是第一条消息');
    document.getElementById('btn2').onclick = () => show('test_role', '测试角色', '这是第二条消息');
    document.getElementById('btn3').onclick = () => show('test_role', '测试角色', '这是第三条消息');
    document.getElementById('btnA').onclick = () => show('char_a', '角色A', '这是角色A的消息');
    document.getElementById('btnB').onclick = () => show('char_b', '角色B', '这是角色B的消息');
    window.addEventListener('load', () => {
      setTimeout(() => log('插件就绪检查: ' + (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BmConversationNotify ? '已加载' : '未加载')), 500);
    });
  </script>
</body>
</html>
